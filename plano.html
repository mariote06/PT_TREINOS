<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171614">
<meta name="robots" content="noindex, nofollow">
<title>O meu plano de treino</title>
<style>
  :root{
    --bg:#171614; --surface:#211f1c; --raised:#2a2824; --line:#3a3731; --text:#f1ece2; --dim:#a59f92;
    --ochre:#C69214; --ok:#6aa874; --font:-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  }
  @media (prefers-color-scheme: light){
    :root{ --bg:#f6f2ea; --surface:#ffffff; --raised:#f0ebe0; --line:#ddd5c5; --text:#25221d; --dim:#6f685b; --ok:#3f8a4d; }
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:var(--font); font-size:16px; line-height:1.45; padding:0 0 40px; }
  .wrap{ max-width:720px; margin:0 auto; padding:0 16px; }
  header{ padding:22px 0 14px; }
  .kicker{ color:var(--ochre); font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; }
  h1{ font-size:24px; margin:4px 0 2px; line-height:1.2; }
  .sub{ color:var(--dim); font-size:14px; }
  .tabs{ display:flex; gap:8px; overflow-x:auto; padding:4px 0 10px; position:sticky; top:0; background:var(--bg); z-index:5; scrollbar-width:none; }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{ flex:0 0 auto; border:1px solid var(--line); background:var(--surface); color:var(--text); border-radius:999px; padding:8px 16px; font-size:15px; font-weight:600; cursor:pointer; min-height:40px; }
  .tab.on{ background:var(--ochre); border-color:var(--ochre); color:#1a1405; }
  .prog{ background:var(--surface); border-left:3px solid var(--ochre); border-radius:8px; padding:10px 12px; margin:6px 0 12px; font-size:14px; }
  .bar{ height:8px; border-radius:99px; background:var(--raised); overflow:hidden; margin:6px 0 4px; }
  .bar > i{ display:block; height:100%; background:var(--ok); width:0; transition:width .25s; }
  .day{ background:var(--surface); border:1px solid var(--line); border-radius:14px; margin-bottom:10px; overflow:hidden; }
  .day-h{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:14px; cursor:pointer; min-height:56px; }
  .day-h.rest{ cursor:default; opacity:.75; }
  .dn{ font-weight:700; font-size:16px; }
  .dw{ color:var(--dim); font-size:14px; }
  .chev{ color:var(--dim); font-size:18px; transition:transform .2s; }
  .day.open .chev{ transform:rotate(90deg); }
  .day-b{ display:none; padding:0 14px 14px; }
  .day.open .day-b{ display:block; }
  .chip{ display:inline-block; background:rgba(198,146,20,.18); color:var(--ochre); border-radius:6px; padding:2px 8px; font-size:12px; font-weight:700; margin-right:6px; }
  .aula{ margin:0 14px 12px; background:var(--raised); border-radius:10px; padding:10px 12px; font-size:14px; }
  .aula b{ font-size:15px; }
  .ex{ display:flex; gap:12px; padding:12px 0; border-top:1px solid var(--line); }
  .ex:first-child{ border-top:none; }
  .ck{ flex:0 0 auto; width:28px; height:28px; border:2px solid var(--line); border-radius:8px; background:transparent; cursor:pointer; display:grid; place-items:center; color:transparent; font-size:18px; font-weight:700; margin-top:2px; }
  .ex.done .ck{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .ex.done .en{ text-decoration:line-through; opacity:.6; }
  .en{ font-weight:700; font-size:16px; }
  .ev{ color:var(--ochre); font-size:14px; font-weight:600; }
  .rx{ display:flex; flex-wrap:wrap; gap:6px 14px; margin:4px 0; font-size:15px; }
  .rx span b{ color:var(--text); }
  .rx span{ color:var(--dim); }
  .nt{ color:var(--dim); font-size:13px; margin-top:2px; }
  .met{ display:inline-block; background:var(--ochre); color:#1a1405; border-radius:5px; padding:0 6px; font-size:11px; font-weight:800; margin-left:6px; vertical-align:middle; }
  .gl{ border-left:3px solid var(--ochre); padding:4px 10px; margin-top:10px; font-size:13px; color:var(--dim); }
  .gl b{ color:var(--text); }
  .empty{ text-align:center; padding:60px 20px; color:var(--dim); }
  footer{ text-align:center; color:var(--dim); font-size:12px; margin-top:24px; }
  button:focus-visible{ outline:2px solid var(--ochre); outline-offset:2px; }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
(function(){
  const app = document.getElementById('app');
  const DIAS = ['Segunda','Terça','Quarta','Quinta','Sexta','Sábado','Domingo'];
  const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  function fromB64u(s){ s = s.replace(/-/g,'+').replace(/_/g,'/'); while(s.length%4) s+='='; const bin = atob(s); const u = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i); return u; }
  async function inflate(u8){ const ds = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw')); return new Uint8Array(await new Response(ds).arrayBuffer()); }
  async function decrypt(str, pin){
    const u8 = fromB64u(str.slice(2));
    const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
    const key = await crypto.subtle.deriveKey({ name:'PBKDF2', salt:u8.slice(0,16), iterations:150000, hash:'SHA-256' }, km, { name:'AES-GCM', length:256 }, false, ['decrypt']);
    const plain = new Uint8Array(await crypto.subtle.decrypt({ name:'AES-GCM', iv:u8.slice(16,28) }, key, u8.slice(28)));
    const body = plain[0]===1 ? await inflate(plain.slice(1)) : plain.slice(1);
    return JSON.parse(new TextDecoder().decode(body));
  }
  async function unpack(str){
    const kind = str.slice(0,2), u8 = fromB64u(str.slice(2));
    if(kind==='z.'){
      const ds = new Blob([u8]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
      return JSON.parse(new TextDecoder().decode(await new Response(ds).arrayBuffer()));
    }
    return JSON.parse(new TextDecoder().decode(u8));
  }
  function fail(msg){ app.innerHTML = '<div class="empty"><h2>Plano não encontrado</h2><p>'+esc(msg)+'</p></div>'; }
  const raw = (location.hash.match(/^#p=(.+)$/)||[])[1];
  if(!raw){ fail('O link está incompleto. Pede ao teu treinador para te enviar o link de novo.'); return; }
  if(raw.slice(0,2)==='e.'){
    let hh = 0; for(let i=0;i<raw.length;i++){ hh = (hh*31 + raw.charCodeAt(i))|0; }
    const PK = 'pin-' + (hh>>>0).toString(36);
    const ask = (msg)=>{
      app.innerHTML = '<div class="empty" style="padding-top:80px"><div class="kicker">Plano de treino</div><h1>Introduz o PIN</h1><p>O teu treinador enviou-te um PIN para abrires este plano.</p>'
        + '<form id="pf"><input id="pin" type="password" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="PIN" style="font-size:24px;text-align:center;letter-spacing:.3em;width:200px;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text)"><br><br>'
        + '<button class="tab on" type="submit" style="padding:12px 28px;font-size:16px">Abrir plano</button></form><p id="pm" style="color:#d9776a;min-height:22px">'+esc(msg||'')+'</p></div>';
      const inp = document.getElementById('pin'); inp.focus();
      document.getElementById('pf').onsubmit = async (ev)=>{
        ev.preventDefault(); const pin = inp.value.trim(); if(!pin) return;
        try{ const P = await decrypt(raw, pin); try{ localStorage.setItem(PK, pin); }catch(e){} start(P); }
        catch(e){ document.getElementById('pm').textContent = 'A verificar…'; setTimeout(()=>ask('PIN incorreto. Tenta outra vez.'), 900); }
      };
    };
    let saved = ''; try{ saved = localStorage.getItem(PK)||''; }catch(e){}
    if(saved) decrypt(raw, saved).then(start).catch(()=>ask()); else ask();
    return;
  }
  unpack(raw).then(start).catch(()=>fail('Não consegui abrir este link. Pede ao teu treinador para o enviar de novo.'));

  function start(P){
    // chave de memória: identifica este plano neste telemóvel
    let h = 0; for(let i=0;i<raw.length;i++){ h = (h*31 + raw.charCodeAt(i))|0; }
    const KEY = 'plano-' + (h>>>0).toString(36);
    let st = { done:{}, week:0 };
    try{ st = Object.assign(st, JSON.parse(localStorage.getItem(KEY)||'{}')); }catch(e){}
    const save = ()=>{ try{ localStorage.setItem(KEY, JSON.stringify(st)); }catch(e){} };
    const nSem = P.s.length;
    if(st.week>=nSem) st.week = 0;
    // semana atual: se o plano tem data de início e ainda não escolheram, abre na semana de hoje
    if(P.i && !st._pick){
      const t = new Date(); t.setHours(0,0,0,0);
      const d0 = new Date(P.i+'T00:00:00'); const w = Math.floor((t - d0)/86400000/7);
      if(w>=0 && w<nSem) st.week = w;
    }
    document.title = 'Plano de treino' + (P.n ? ' · '+P.n : '');

    function fmtDate(iso){ const m = String(iso||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? m[3]+'/'+m[2]+'/'+m[1] : ''; }

    function render(){
      const wk = P.s[st.week];
      const dkey = (d)=>st.week+'.'+d;
      let total = 0, done = 0;
      wk.d.forEach((day,di)=>{ if(day[0]>=0){ const w = P.w[day[0]]; (w.e||[]).forEach((x,xi)=>{ total++; if(st.done[dkey(di)+'.'+xi]) done++; }); } });
      const days = wk.d.map((day,di)=>{
        const wi = day[0], ai = day[1], hora = day[2], pt = !!day[3], ptH = day[4]||'';
        const rest = wi<0 && ai<0 && !pt;
        const w = wi>=0 ? P.w[wi] : null;
        const a = ai>=0 ? P.a[ai] : null;
        const open = st['open.'+dkey(di)] ? ' open' : '';
        const title = pt ? 'Treino de PT' : (w ? esc(w.n) : (a ? '' : 'Descanso'));
        const sub = [pt ? ((ptH ? 'às '+esc(ptH)+' · ' : '') + (day[5]==='casa' ? 'em casa · ' : (day[5]==='ginasio' ? 'no ginásio · ' : '')) + 'com o teu treinador') : '', w ? (w.e||[]).length+' exercícios' : '', a ? '<span class="chip">Aula</span>'+esc(a.n)+(hora?' · '+esc(hora):'') : ''].filter(Boolean).join(' · ');
        let aulaHtml = '';
        if(a) aulaHtml = '<div class="aula" style="margin-top:0"><b>'+esc(a.n)+'</b> · '+esc(a.du)+' min · '+esc(a.i)+(hora?' · '+esc(hora):'')+(a.ds?'<div class="sub" style="margin-top:4px">'+esc(a.ds)+'</div>':'')+'</div>';
        let exHtml = '';
        const usedMet = [];
        if(w){
          exHtml = '<div class="day-b">' + (w.e||[]).map((x,xi)=>{
            const k = dkey(di)+'.'+xi, dn = st.done[k];
            if(x.m && !usedMet.includes(x.m)) usedMet.push(x.m);
            return '<div class="ex'+(dn?' done':'')+'"><button class="ck" data-k="'+k+'" aria-label="Marcar como feito">✓</button><div style="min-width:0;flex:1">'
              + '<div class="en">'+esc(x.x)+(x.m?'<span class="met">'+esc(x.m)+'</span>':'')+'</div>'
              + (x.v?'<div class="ev">Variante: '+esc(x.v)+'</div>':'')
              + '<div class="rx"><span><b>'+esc(x.s)+'</b> séries</span><span><b>'+esc(x.r)+'</b> reps</span>'+(x.c?'<span>Carga <b>'+esc(x.c)+'</b></span>':'')+(x.d?'<span>Descanso <b>'+esc(x.d)+'</b></span>':'')+'</div>'
              + (x.t?'<div class="nt">'+esc(x.t)+'</div>':'')
              + '</div></div>';
          }).join('')
          + usedMet.map(m=>{ const g = (P.m||{})[m]; return g ? '<div class="gl"><b>'+esc(m)+':</b> '+esc(g.d)+(g.o?' <i>Objetivo: '+esc(g.o)+'</i>':'')+'</div>' : ''; }).join('')
          + '</div>';
        }
        return '<div class="day'+open+'" data-d="'+di+'">'
          + '<div class="day-h'+(rest?' rest':'')+'" '+(w?'data-t="'+dkey(di)+'"':'')+'><div><div class="dn">'+DIAS[di]+'</div><div class="dw">'+(title||'')+(title&&sub?' · ':'')+(rest?'':sub)+'</div></div>'+(w?'<span class="chev">›</span>':'')+'</div>'
          + (a ? '<div style="padding:0 14px 12px">'+aulaHtml+'</div>' : '')
          + exHtml
          + '</div>';
      }).join('');

      app.innerHTML =
        '<header><div class="kicker">Plano de treino</div><h1>'+esc(P.n ? 'Olá, '+P.n : 'O teu plano')+'</h1>'
        + '<div class="sub">'+esc(P.c)+(P.i?' · início '+fmtDate(P.i):'')+' · '+nSem+' semanas</div></header>'
        + '<div class="tabs" role="tablist">'+P.s.map((s,i)=>'<button class="tab'+(i===st.week?' on':'')+'" data-w="'+i+'">Semana '+s.n+'</button>').join('')+'</div>'
        + (wk.p ? '<div class="prog"><b>Progressão:</b> '+esc(wk.p)+'</div>' : '')
        + (total ? '<div class="sub">'+done+' de '+total+' exercícios feitos esta semana</div><div class="bar"><i style="width:'+Math.round(done/total*100)+'%"></i></div>' : '')
        + '<div style="margin-top:10px">'+days+'</div>'
        + '<footer>Plano preparado pelo teu personal trainer.<br>Em caso de dor ou desconforto, pára o exercício e fala com ele.</footer>';

      app.querySelectorAll('.tab').forEach(b=>b.onclick=()=>{ st.week = +b.dataset.w; st._pick = 1; save(); render(); window.scrollTo(0,0); });
      app.querySelectorAll('.day-h[data-t]').forEach(h=>h.onclick=()=>{ const k = 'open.'+h.dataset.t; st[k] = !st[k]; save(); render(); });
      app.querySelectorAll('.ck').forEach(b=>b.onclick=(ev)=>{ ev.stopPropagation(); st.done[b.dataset.k] = !st.done[b.dataset.k]; save(); render(); });
    }
    render();
  }
})();
</script>
</body>
</html>
